name: levl
description: Personal life progression system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^14.0.0

  # Local database (offline-first)
  isar: 3.1.0+1
  isar_flutter_libs: 3.1.0+1

  # Backend
  supabase_flutter: ^2.9.0

  # UI & Fonts
  google_fonts: ^7.0.0

  # Animations
  lottie: ^3.1.0

  # Audio
  just_audio: ^0.9.40

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1
  shared_preferences: ^2.3.0

  # Avatar
  flutter_svg: ^2.0.10+1
  http: ^1.2.0

  # Apple Sign-In (native on iOS, required by App Store)
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3

  # Utils
  path_provider: ^2.1.0
  image_picker: ^1.1.2
  geolocator: ^14.0.3
  flutter_dotenv: ^5.1.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  riverpod_generator: ^2.4.0
  isar_generator: 3.1.0+1
  build_runner: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/character/
    - assets/character_v2/faces/
    - assets/animations/
    - assets/animations/lottie/
    - assets/sounds/
    - .env
