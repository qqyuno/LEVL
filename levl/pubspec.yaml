name: levl
description: Personal life progression system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^14.0.0

  # Local database (offline-first)
  isar: 3.1.0+1
  isar_flutter_libs: 3.1.0+1

  # Backend
  supabase_flutter: ^2.5.0

  # UI & Fonts
  google_fonts: ^7.0.0

  # Animations
  lottie: ^3.1.0

  # Audio
  just_audio: ^0.9.40

  # Utils
  path_provider: ^2.1.0
  flutter_dotenv: ^5.1.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  riverpod_generator: ^2.4.0
  isar_generator: 3.1.0+1
  build_runner: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/character/
    - assets/animations/
    - assets/animations/lottie/
    - assets/sounds/
    - .env
